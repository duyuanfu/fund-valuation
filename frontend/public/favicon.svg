<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- 背景连续平滑渐变：深邃尊贵皇家蓝到活力科技蓝 -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>

    <!-- 折线行情与面积柔和光晕 -->
    <linearGradient id="areaGrad" x1="0" y1="20" x2="0" y2="48" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.0" />
    </linearGradient>

    <linearGradient id="lineGrad" x1="12" y1="42" x2="52" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#67e8f9" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <!-- 柔和环境微阴影 -->
    <filter id="glow" x="6" y="14" width="52" height="38" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 现代 Apple / iOS 风格 Squircle 圆角矩形底座 (外框裁切并带极细微光圈) -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />
  <rect x="0.75" y="0.75" width="62.5" height="62.5" rx="15.25" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1.5" />

  <!-- 走势面积填充 -->
  <path d="M 14 42 L 24 35 L 34 38 L 50 20 L 50 48 L 14 48 Z" fill="url(#areaGrad)" />

  <!-- 估值主上升脉冲折线 (金色/青白高对比曲线) -->
  <path d="M 14 42 L 24 35 L 34 38 L 50 20" stroke="url(#lineGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />

  <!-- 最新行情脉冲最高亮点与外层光圈 -->
  <circle cx="50" cy="20" r="4.5" fill="#ffffff" />
  <circle cx="50" cy="20" r="2.2" fill="#0284c7" />
  <circle cx="24" cy="35" r="2" fill="#ffffff" fill-opacity="0.8" />
  <circle cx="34" cy="38" r="2" fill="#ffffff" fill-opacity="0.8" />
</svg>
