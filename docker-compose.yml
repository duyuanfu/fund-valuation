services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: fund-app
    restart: always
    ports:
      # 仅绑定宿主机 127.0.0.1 回环地址，由宿主机 Nginx 独占代理，杜绝外部明文直连 8888 绕过 HTTPS
      - "127.0.0.1:8888:8080"
    environment:
      - TZ=Asia/Shanghai
      - JAVA_OPTS=-Xms256m -Xmx512m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
      # 连接公共共享 MySQL 容器 shared-mysql (走 shared-net 内部网桥通信)
      - SPRING_DATASOURCE_URL=jdbc:mysql://${SHARED_MYSQL_HOST:-shared-mysql}:${SHARED_MYSQL_PORT:-3306}/${MYSQL_DB:-fund_valuation}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai
      - SPRING_DATASOURCE_USERNAME=${FUND_DB_USER:-fund_user}
      - SPRING_DATASOURCE_PASSWORD=${FUND_DB_PASSWORD:-YourSecurePassword123!}
    networks:
      - shared-net
    deploy:
      resources:
        limits:
          memory: 750M

networks:
  shared-net:
    external: true
