spring:
  application:
    name: fund-valuation
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fund_valuation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json

fund:
  schedule:
    nav-cron: "0 30 20 * * *"
    holding-cron: "0 0 21 * * *"
    intraday-interval-ms: 120000
  quote:
    fresh-seconds: 300
  history:
    retain-days: 30
  bond:
    index-secid: "103.TY00Y"
    reference-duration: 10.0
    default-duration: 2.0
  jwt:
    secret: ${JWT_SECRET:fund-valuation-dev-secret-change-me-0123456789}
    expire-days: 7
  calendar:
    holidays:
      # 上交所 休市安排 获取
      # 春节 (2月15日(周日)至2月23日(周一)休市，2月24日(周二)起照常开市。2月14日(周六)、2月28日(周六)为周末休市)
      - "2026-02-15"
      - "2026-02-16"
      - "2026-02-17"
      - "2026-02-18"
      - "2026-02-19"
      - "2026-02-20"
      - "2026-02-21"
      - "2026-02-22"
      - "2026-02-23"
      # 端午节 (6月19日(周五)至6月21日(周日)休市，6月22日(周一)起照常开市)
      - "2026-06-19"
      - "2026-06-20"
      - "2026-06-21"
      # 中秋节 (9月25日(周五)至9月27日(周日)休市，9月28日(周一)起照常开市)
      - "2026-09-25"
      - "2026-09-26"
      - "2026-09-27"
