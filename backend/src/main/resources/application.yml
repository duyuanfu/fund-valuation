spring:
  application:
    name: fund-valuation
  mvc:
    async:
      request-timeout: 1800000
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:fund_valuation}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

server:
  port: ${SERVER_PORT:8080}
  compression:
    enabled: true
    min-response-size: 1024
    mime-types:
      - text/html
      - text/xml
      - text/plain
      - text/css
      - text/javascript
      - application/javascript
      - application/json

fund:
  schedule:
    nav-cron: "0 30 20 * * *"
    holding-cron: "0 0 21 * * *"
    intraday-interval-ms: 120000
  quote:
    fresh-seconds: 300
  history:
    retain-days: 30
  bond:
    index-secid: "103.TY00Y"
    reference-duration: 10.0
    default-duration: 2.0
  jwt:
    secret: ${JWT_SECRET:fund-valuation-dev-secret-change-me-0123456789}
    expire-days: 7
  notice:
    enabled: true
    message: "系统公告：自选列表现已上线收益率升序/降序快速排序功能，并支持交易所全天分时线！"
    type: "info"
    closable: true
  calendar:
    holidays:
      # 元旦 (1月1日(周四)至1月3日(周六)休市，1月5日(周一)起照常开市。1月4日(周日)为周末休市)
      - "2026-01-01"
      - "2026-01-02"
      - "2026-01-03"
      # 春节 (2月15日(周日)至2月23日(周一)休市，2月24日(周二)起照常开市。2月14日(周六)、2月28日(周六)为周末休市)
      - "2026-02-15"
      - "2026-02-16"
      - "2026-02-17"
      - "2026-02-18"
      - "2026-02-19"
      - "2026-02-20"
      - "2026-02-21"
      - "2026-02-22"
      - "2026-02-23"
      # 清明节 (4月4日(周六)至4月6日(周一)休市，4月7日(周二)起照常开市)
      - "2026-04-04"
      - "2026-04-05"
      - "2026-04-06"
      # 劳动节 (5月1日(周五)至5月5日(周二)休市，5月6日(周三)起照常开市。5月9日(周六)为周末休市)
      - "2026-05-01"
      - "2026-05-02"
      - "2026-05-03"
      - "2026-05-04"
      - "2026-05-05"
      # 端午节 (6月19日(周五)至6月21日(周日)休市，6月22日(周一)起照常开市)
      - "2026-06-19"
      - "2026-06-20"
      - "2026-06-21"
      # 中秋节 (9月25日(周五)至9月27日(周日)休市，9月28日(周一)起照常开市)
      - "2026-09-25"
      - "2026-09-26"
      - "2026-09-27"
      # 国庆节 (10月1日(周四)至10月7日(周三)休市，10月8日(周四)起照常开市。9月20日(周日)、10月10日(周六)为周末休市)
      - "2026-10-01"
      - "2026-10-02"
      - "2026-10-03"
      - "2026-10-04"
      - "2026-10-05"
      - "2026-10-06"
      - "2026-10-07"
